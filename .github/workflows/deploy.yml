name: Deployment Project
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'
      - name: Install dependencies
        run: npm ci
      - name: Lint checking
        run: npm run lint
      - name: Run Tests
        run: npm test
  deploy:
    needs: test
    runs-on: ubuntu-latest 
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'
      - name: Install dependencies
        run: npm ci
      - name: Lint checking
        run: npm run lint
      - name: Run Tests
        run: npm test   
      - name: Deploy
        run: echo "Deploy to cloud"


